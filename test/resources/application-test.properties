# H2 in-memory DB for tests (MySQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:goallog_test;MODE=MYSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Fixed JWT secret for deterministic tests (>= 256 bits)
jwt.secret=test-secret-key-must-be-at-least-256-bits-long-enough-for-jwt-here
jwt.expiration=3600000

# Allow Jackson to deserialize private fields (DTOs use @Getter only)
spring.jackson.visibility.field=any
spring.jackson.visibility.getter=none
spring.jackson.visibility.is-getter=none
spring.jackson.visibility.setter=none
spring.jackson.visibility.creator=any
